<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var theme = 'light'
        try {
          var savedTheme = localStorage.getItem('cadtech-theme')
          theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        } catch (error) {
          try { theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light' } catch (ignored) {}
        }
        document.documentElement.dataset.theme = theme
      }())
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/png" href="/fevicon.png" />
    <title>Page Not Found | CadTech Solution</title>
    <style>
      :root {
        --color-primary: #292B33;
        --color-accent: #D8B85A;
        --color--secondary: #A92F35;
        --color-bg: #F7F7F5;
        --color-text: #292B33;
        --color-text-muted: #6B6E76;
      }
      html[data-theme="dark"] {
        --color-bg: #292B33;
        --color-text: #F7F7F5;
        --color-text-muted: #B7B9BF;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        display: grid;
        min-height: 100vh;
        place-content: center;
        padding: 3rem 1.5rem;
        background: var(--color-bg);
        color: var(--color-text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
      }
      .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 1.25rem;
        color: var(--color-accent);
      }
      h1 { margin: 0 0 0.5rem; font-size: clamp(1.8rem, 4vw, 2.4rem); font-weight: 800; }
      p { margin: 0 0 1.75rem; color: var(--color-text-muted); }
      .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
      a.button {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        border-radius: 10px;
        padding: 0.8rem 1.4rem;
        font-size: 0.9rem;
        font-weight: 700;
        text-decoration: none;
        transition: background-color 0.2s, color 0.2s, border-color 0.2s;
      }
      a.button-primary { background: var(--color-accent); color: var(--color-primary); }
      a.button-primary:hover { background: #E8D58A; }
      a.button-outline { border: 1px solid var(--color-text-muted); color: var(--color-text); }
      a.button-outline:hover { border-color: var(--color-accent); color: var(--color-accent); }
    </style>
  </head>
  <body>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 3l18 18" />
      <path d="M10.58 10.58a2 2 0 0 0 2.83 2.83" />
      <circle cx="11" cy="11" r="8" />
    </svg>
    <h1>Page Not Found</h1>
    <p>The page you are looking for doesn’t exist or may have been moved.</p>
    <div class="actions">
      <a class="button button-primary" href="/">Back to Home</a>
      <a class="button button-outline" href="/courses">Browse Courses</a>
    </div>
  </body>
</html>
