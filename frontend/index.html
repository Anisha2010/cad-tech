<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var theme = 'light'
        try {
          var savedTheme = localStorage.getItem('cadtech-theme')
          theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        } catch (error) {
          try { theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light' } catch (ignored) {}
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.dataset.bsTheme = theme
      }())
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAD Tech Solution</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
