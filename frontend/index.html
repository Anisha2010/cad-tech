  <head>
    <script>
      (function () {
        var theme = 'light'
        try {
          var savedTheme = localStorage.getItem('cadtech-theme')
          theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        } catch (error) {
          try { theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light' } catch (ignored) {}
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.dataset.bsTheme = theme
      }())
    </script>
